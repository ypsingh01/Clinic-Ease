name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinicease
          POSTGRES_PASSWORD: clinicease
          POSTGRES_DB: clinicease
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicease"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clinicease:clinicease@localhost:5432/clinicease?schema=public
      JWT_SECRET: ci-test-jwt-secret-at-least-32-chars
      NODE_ENV: development
      ALLOW_MOCK_PAY: 'true'
      OTP_DEV_CODE: '123456'
      RECAPTCHA_MODE: stub
      WHATSAPP_MODE: mock
      CLIENT_ORIGIN: http://localhost:5173
      SEED_DEMO_USERS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm run db:seed
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com
          VITE_SOCKET_URL: https://api.example.com
          VITE_USE_MOCK_CLINIC: 'false'
          VITE_DEMO_LOGIN: 'false'
