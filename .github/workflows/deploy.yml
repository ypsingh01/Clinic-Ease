name: Deploy hints

# Railway and Vercel deploy from their GitHub integrations.
# This workflow only verifies production build artifacts on main.

on:
  push:
    branches: [main, master]

jobs:
  verify-prod-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend build
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db?schema=public
          JWT_SECRET: verify-build-jwt-secret-32-chars-min
          NODE_ENV: development
      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://api.example.com
          VITE_SOCKET_URL: https://api.example.com
          VITE_USE_MOCK_CLINIC: 'false'
          VITE_DEMO_LOGIN: 'false'
