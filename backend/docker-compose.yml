services:
  postgres:
    image: postgres:16-alpine
    container_name: clinicease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinicease
      POSTGRES_PASSWORD: clinicease
      POSTGRES_DB: clinicease
    ports:
      - "5432:5432"
    volumes:
      - clinicease_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicease -d clinicease"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clinicease_pg:
